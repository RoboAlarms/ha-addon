[tool.ruff]
# py313 on purpose: with py314, ruff rewrites `except (A, B):` into PEP 758's
# unparenthesized form, which every pre-3.14 parser refuses. HA runs on 3.14,
# but the conservative syntax costs nothing and keeps other tooling working.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "B",   # bugbear
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aioroboalarms"
version = "0.1.0"
description = "Asyncio client for the RoboAlarms local mutual-TLS panel protocol"
readme = "protocol/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["cryptography>=44"]

[project.urls]
Source = "https://github.com/RoboAlarms/ha-addon"
Issues = "https://github.com/RoboAlarms/ha-addon/issues"

[tool.setuptools]
py-modules = ["aioroboalarms"]
package-dir = {"" = "protocol"}
