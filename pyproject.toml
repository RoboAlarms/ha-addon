[tool.ruff]
# py313 on purpose: with py314, ruff rewrites `except (A, B):` into PEP 758's
# unparenthesized form, which every pre-3.14 parser refuses. HA runs on 3.14,
# but the conservative syntax costs nothing and keeps other tooling working.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "B",   # bugbear
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
